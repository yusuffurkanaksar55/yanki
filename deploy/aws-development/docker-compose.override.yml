services:
  api-gw:
    ports: !override
      - "127.0.0.1:${API_GW_HTTP_PORT:-8000}:8000/tcp"

  supavisor:
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
      - "127.0.0.1:${POOLER_PROXY_PORT_TRANSACTION:-6543}:6543"

  functions:
    environment:
      YANKI_SENSITIVE_GATEWAY_REQUIRED: "true"
      YANKI_SENSITIVE_GATEWAY_TOKEN: ${YANKI_SENSITIVE_GATEWAY_TOKEN:?YANKI_SENSITIVE_GATEWAY_TOKEN is required}

  yanki-web:
    container_name: yanki-development-web
    build:
      context: ${YANKI_APP_SOURCE_DIR:?YANKI_APP_SOURCE_DIR is required}
      args:
        OCI_REVISION: ${YANKI_WEB_OCI_REVISION:?YANKI_WEB_OCI_REVISION is required}
        OCI_SOURCE: https://github.com/yusuffurkanaksar55/yanki
        OCI_VERSION: aws-development
    image: ${YANKI_WEB_IMAGE:?YANKI_WEB_IMAGE is required}
    restart: unless-stopped
    depends_on:
      api-gw:
        condition: service_healthy
      functions:
        condition: service_healthy
    environment:
      NGINX_LOCAL_RESOLVERS: 127.0.0.11
      SUPABASE_ANON_KEY: ${ANON_KEY:?ANON_KEY is required}
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:?SUPABASE_PUBLIC_URL is required}
      SUPABASE_UPSTREAM_URL: http://api-gw:8000
      YANKI_SENSITIVE_GATEWAY_TOKEN: ${YANKI_SENSITIVE_GATEWAY_TOKEN:?YANKI_SENSITIVE_GATEWAY_TOKEN is required}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    logging:
      driver: local
      options:
        max-file: "3"
        max-size: 10m

  caddy:
    container_name: yanki-development-caddy
    image: docker.io/library/caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    depends_on:
      yanki-web:
        condition: service_healthy
    environment:
      YANKI_PUBLIC_HOST: ${YANKI_PUBLIC_HOST:?YANKI_PUBLIC_HOST is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${YANKI_APP_SOURCE_DIR:?YANKI_APP_SOURCE_DIR is required}/deploy/aws-development/Caddyfile:/etc/caddy/Caddyfile:ro
      - yanki-caddy-data:/data
      - yanki-caddy-config:/config
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: local
      options:
        max-file: "3"
        max-size: 10m

volumes:
  yanki-caddy-config:
  yanki-caddy-data:
