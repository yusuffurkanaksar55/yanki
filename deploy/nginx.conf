map_hash_bucket_size 128;

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

map $uri $yanki_sensitive_gateway_token {
  default "";
  /supabase/functions/v1/anonymous-evaluation-submissions ${YANKI_SENSITIVE_GATEWAY_TOKEN};
  /supabase/functions/v1/evaluation-submission-credentials ${YANKI_SENSITIVE_GATEWAY_TOKEN};
}

limit_conn_zone $binary_remote_addr zone=yanki_client_connections:10m;
limit_req_zone $binary_remote_addr zone=yanki_anonymous_client:10m rate=240r/m;
limit_req_zone $binary_remote_addr zone=yanki_credential_client:10m rate=120r/m;
limit_req_zone $server_name zone=yanki_anonymous_global:1m rate=1200r/m;
limit_req_zone $server_name zone=yanki_credential_global:1m rate=600r/m;

log_format yanki_gateway
  '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=off;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  access_log /var/log/nginx/access.log yanki_gateway;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

  proxy_http_version 1.1;
  proxy_ssl_server_name on;
  proxy_set_header Host $proxy_host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Yanki-Sensitive-Gateway-Token $yanki_sensitive_gateway_token;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_connect_timeout 5s;
  proxy_send_timeout 30s;
  proxy_read_timeout 65s;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /app-config.js {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    try_files $uri =404;
  }

  location = /supabase/functions/v1/anonymous-evaluation-submissions {
    access_log off;
    client_max_body_size 256k;
    limit_conn yanki_client_connections 20;
    limit_conn_log_level info;
    limit_conn_status 429;
    limit_req zone=yanki_anonymous_client burst=60 nodelay;
    limit_req zone=yanki_anonymous_global burst=240 nodelay;
    limit_req_status 429;
    limit_req_log_level info;
    set $supabase_upstream ${SUPABASE_UPSTREAM_URL};
    proxy_pass $supabase_upstream/functions/v1/anonymous-evaluation-submissions;
  }

  location = /supabase/functions/v1/evaluation-submission-credentials {
    access_log off;
    client_max_body_size 16k;
    limit_conn yanki_client_connections 20;
    limit_conn_log_level info;
    limit_conn_status 429;
    limit_req zone=yanki_credential_client burst=30 nodelay;
    limit_req zone=yanki_credential_global burst=120 nodelay;
    limit_req_status 429;
    limit_req_log_level info;
    set $supabase_upstream ${SUPABASE_UPSTREAM_URL};
    proxy_pass $supabase_upstream/functions/v1/evaluation-submission-credentials;
  }

  location /supabase/ {
    client_max_body_size 8m;
    limit_conn yanki_client_connections 40;
    limit_conn_log_level info;
    limit_conn_status 429;
    set $supabase_upstream ${SUPABASE_UPSTREAM_URL};
    rewrite ^/supabase/(.*)$ /$1 break;
    proxy_pass $supabase_upstream;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
