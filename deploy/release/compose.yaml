name: yanki

services:
  web:
    image: ${YANKI_IMAGE:?YANKI_IMAGE must be an immutable digest reference}
    pull_policy: always
    restart: unless-stopped
    environment:
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:?SUPABASE_PUBLIC_URL is required}
      SUPABASE_UPSTREAM_URL: ${SUPABASE_UPSTREAM_URL:?SUPABASE_UPSTREAM_URL is required}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY is required}
      YANKI_SENSITIVE_GATEWAY_TOKEN: ${YANKI_SENSITIVE_GATEWAY_TOKEN:?YANKI_SENSITIVE_GATEWAY_TOKEN is required}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
