name: Container release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: container-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  publish:
    name: Publish signed OCI release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Validate release tag
        env:
          YANKI_RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: npm run release:validate-tag

      - name: Run application quality gate
        run: |
          npm ci
          npm run check

      - name: Set up emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-platform image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Yanki
            org.opencontainers.image.description=Anonymous employee and project evaluation platform
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
          build-args: |
            OCI_SOURCE=https://github.com/${{ github.repository }}
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ env.RELEASE_TAG }}
          provenance: mode=max
          sbom: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign and verify image digest
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/container-release.yml@${{ github.ref }}
          IMAGE_REFERENCE: ${{ env.IMAGE_REPOSITORY }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE_REFERENCE"
          cosign verify "$IMAGE_REFERENCE" \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Attest image with GitHub
        if: ${{ github.event.repository.private == false || vars.YANKI_ENABLE_PRIVATE_GITHUB_ATTESTATIONS == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Extract SBOM and provenance
        env:
          IMAGE_REFERENCE: ${{ env.IMAGE_REPOSITORY }}@${{ steps.build.outputs.digest }}
        run: |
          mkdir release
          docker buildx imagetools inspect "$IMAGE_REFERENCE" --format '{{ json .SBOM }}' > release/image-sbom.json
          docker buildx imagetools inspect "$IMAGE_REFERENCE" --format '{{ json .Provenance }}' > release/image-provenance.json

      - name: Prepare digest-pinned customer package
        env:
          YANKI_RELEASE_TAG: ${{ env.RELEASE_TAG }}
          YANKI_SOURCE_COMMIT: ${{ github.sha }}
          YANKI_IMAGE_REPOSITORY: ${{ env.IMAGE_REPOSITORY }}
          YANKI_IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: npm run release:prepare

      - name: Validate package metadata
        run: node release/verify-release-installation.mjs --metadata-only

      - name: Sign and verify release manifest
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/container-release.yml@${{ github.ref }}
        run: |
          cosign sign-blob --yes \
            --bundle release/release-manifest.sigstore.json \
            release/release-manifest.json
          cosign verify-blob release/release-manifest.json \
            --bundle release/release-manifest.sigstore.json \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Create release checksums
        run: npm run release:checksums

      - name: Attest release files with GitHub
        if: ${{ github.event.repository.private == false || vars.YANKI_ENABLE_PRIVATE_GITHUB_ATTESTATIONS == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/*

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to mutate it." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release/* \
            --verify-tag \
            --title "Yanki $RELEASE_TAG" \
            --generate-notes
